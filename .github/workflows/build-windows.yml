name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 matplotlib pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LayaqTradingJournal app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LayaqTradingJournal-Windows
          path: dist/LayaqTradingJournal.exe
