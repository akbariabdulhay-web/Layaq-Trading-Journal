name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build requirements
        run: python -m pip install pillow pyinstaller matplotlib
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LayaqTradingJournal --icon icon.ico --add-data "icon.png;." app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LayaqTradingJournal-Windows
          path: dist/LayaqTradingJournal.exe
          if-no-files-found: error
          retention-days: 7
